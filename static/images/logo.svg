<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="prpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M50,8 L85,22 C85,55 50,88 50,88 C50,88 15,55 15,22 Z" 
        fill="url(#prpGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        filter="url(#glow)"/>

  <!-- Inner Crest Line -->
  <path d="M50,14 L80,26 C80,53 50,80 50,80 C50,80 20,53 20,26 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.3" 
        stroke-width="1.5"/>

  <!-- Graduation Cap / Temple Icon -->
  <!-- Cap Diamond -->
  <polygon points="50,26 68,34 50,42 32,34" fill="url(#goldGrad)" />
  <!-- Skull Cap -->
  <path d="M40,38.5 L40,46 C40,49 60,49 60,46 L60,38.5" fill="#f59e0b" />
  <!-- Tassel -->
  <path d="M68,34 L72,44 L70,44.5" stroke="#fbbf24" stroke-width="1.5" fill="none" />

  <!-- Open Book Symbol -->
  <path d="M30,58 C38,54 48,56 50,60 C52,56 62,54 70,58 L70,68 C62,64 52,66 50,70 C48,66 38,64 30,68 Z" 
        fill="#ffffff" />
  <!-- Book spine line -->
  <line x1="50" y1="60" x2="50" y2="70" stroke="url(#prpGrad)" stroke-width="1.5" />

  <!-- College Initials PRPCEM -->
  <text x="50" y="80" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="8" 
        font-weight="900" 
        letter-spacing="1.5" 
        fill="#ffffff" 
        text-anchor="middle">PRPCEM</text>
</svg>
