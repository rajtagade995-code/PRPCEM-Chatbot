<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - PRPCEM College Assistant</title>
  <link rel="icon" href="/static/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top, var(--bg-secondary) 0%, var(--bg-primary) 100%);
    }
    .login-card {
      background: var(--bg-glass);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 420px;
      width: 100%;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(12px);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header .college-emblem {
      margin: 0 auto 12px auto;
      width: 56px;
      height: 56px;
    }
    .login-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .login-header p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-control:focus {
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-glow);
    }
    .alert {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }
    .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger-color);
      color: #fca5a5;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success-color);
      color: #6ee7b7;
    }
    .btn-block {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
    }
    .login-footer a {
      color: var(--accent-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="college-emblem">
          <img src="/static/images/logo.svg" alt="PRPCEM">
        </div>
        <h2>PRPCEM Admin Portal</h2>
        <p>Official College Information Assistant</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="/admin/login">
        <div class="form-group">
          <label for="username">Administrator Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="admin"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••••••"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block">Secure Login</button>
      </form>

      <div class="login-footer">
        <a href="/">← Return to Student Assistant</a>
      </div>
    </div>
  </div>

  <script src="/static/js/theme.js"></script>
</body>
</html>
